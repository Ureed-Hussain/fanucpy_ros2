name: ROS 2 Humble CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Humble)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:jammy

    steps:
      - name: Set up ROS 2 tooling
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Build and test workspace
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: humble
          package-name: >-
            fanuc_m10ia_moveit_config
            fanucpy_ros2_bringup
            fanucpy_ros2_controller
            fanucpy_ros2_driver
            fanucpy_ros2_examples
            fanucpy_ros2_interfaces
            fanucpy_ros2_trajectory_controller
            fanucpy_ros2_visualization
          coverage-result: false
          rosdep-check: true
