# Keep the ROS 2 Humble ament_flake8 defaults while making optional plugin
# behavior deterministic across local and GitHub Actions environments.
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
inline-quotes = double
multiline-quotes = double
docstring-quotes = double
max-line-length = 99
show-source = true
statistics = true
